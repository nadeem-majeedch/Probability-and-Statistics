hooks:
  - hooks/quiz.py

plugins:
  - search:
      lang: en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  # Enabling `git-revision-date-localized` requires commit history to exist.
  # The repository has no commits until the instructor's first commit, so the
  # plugin is added in the phase that follows it (recorded in the Phase 1 report).
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: date
  #     fallback_to_build_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/assessment.css

# Load order matters: mathjax.js configures window.MathJax before the library
# loads, and labs.js expects the design-system classes from extra.css.
extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/quiz.js
  - assets/javascripts/progress.js
  # Loads the laboratory runtime (stats, viz, labs, kit, lab module) only on
  # pages with a <div data-lab>.
  - assets/javascripts/labs-loader.js
  - assets/javascripts/print-links.js
  # Takes a copy of every ```mermaid diagram before the library loads, so the
  # library's own auto-run cannot consume the source and leave a blank block.
  - assets/javascripts/mermaid-init.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nadeem-majeedch/Probability-and-Statistics
  generator: false

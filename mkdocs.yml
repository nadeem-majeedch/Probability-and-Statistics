# ---------------------------------------------------------------------------
# Probability and Statistics for Data Science
# Site configuration — MkDocs Material
#
# Scope note: `nav` lists only pages that exist. Modules are added to `nav` as
# each phase delivers them, so the build is strict-clean at every phase boundary
# rather than pointing at 30 unwritten pages.
# ---------------------------------------------------------------------------

site_name: Probability and Statistics for Data Science
site_description: >-
  A complete self-study course in probability and statistics for BS Data Science
  students — derivations, worked examples, simulations, Python and interactive
  labs.
site_author: Engr. Dr. Muhammad Nadeem Majeed
site_url: https://nadeem-majeedch.github.io/Probability-and-Statistics/
repo_url: https://github.com/nadeem-majeedch/Probability-and-Statistics
repo_name: nadeem-majeedch/Probability-and-Statistics
edit_uri: edit/main/docs/
copyright: >-
  © 2026 Engr. Dr. Muhammad Nadeem Majeed · Department of Data Science (PUCIT),
  University of the Punjab, Lahore · Content CC BY-NC-SA 4.0 · Code MIT

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/images/brand/logo.svg
  favicon: assets/images/brand/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

